[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/netlify/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-P+p5bcuAzz9cuaboc4nkITFr+YpkQFjAYL/m52v3WQM='; connect-src 'self'; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/api/celeste"
  to = "/.netlify/functions/celeste"
  status = 200
  force = true

# Optional redirect for single-page app behavior if you add client-side routing later.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
